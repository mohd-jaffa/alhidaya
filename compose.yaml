# Local services for development and the tests (plan §35.1): MySQL at the
# client's server's exact version, and Mailpit to catch every email. Ports are
# 563xx and bound to this machine only, so they run beside other projects
# (clinicdesk uses 553xx). CI starts the same file. Both images come from
# their mirrors outside Docker Hub (AWS's copy of the official MySQL image,
# Mailpit's own GitHub registry): no Docker Hub pull limits in CI.
name: alhidaya

services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.0.46
    environment:
      # This machine only; never a production value.
      MYSQL_ROOT_PASSWORD: local-root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:56306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root"]
      interval: 3s
      timeout: 5s
      retries: 40

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:56324:8025" # the inbox, in a browser
      - "127.0.0.1:56325:1025" # SMTP

volumes:
  mysql-data:
