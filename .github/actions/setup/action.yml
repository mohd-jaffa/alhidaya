name: Node dependencies
description: Use the pinned Node major and npm 11, with the lockfile cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm install -g npm@11
      shell: bash
    - run: npm ci
      shell: bash
