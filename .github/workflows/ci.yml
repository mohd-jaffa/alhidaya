# Only what protects main, built to finish well inside ten minutes (D207): the static and security gates,
# every unit and database test at 100% coverage, the build, and the phone and desktop journeys with axe on
# every page. The slow serial suites (coverage, E2E) are sharded across parallel jobs, each with its own
# database and app; independent gates start together and one build feeds the browser jobs. The report-only
# performance budgets and the development-hydration check are not run here: they stay in the local
# `npm run verify` (D194, D207).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format, types, test-file layout and both dependency audits: about a minute each, one runner.
  # Each step runs even if an earlier one failed, so one run shows every problem.
  static:
    name: Static and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: node scripts/check-test-paths.mjs
        if: ${{ !cancelled() }}
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() }}
      - run: npm run audit:shipped
        if: ${{ !cancelled() }}

  # Every unit and database test, in four shards. A shard holds part of the code, so it checks no
  # threshold (COVERAGE_SHARD in vitest.config.mts); the next job merges them and demands 100%.
  coverage:
    name: coverage ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env.local
      - uses: ./.github/actions/services
      # AVIF encoding and DB writes stay serial within a shard.
      - run: npx vitest run --reporter=blob --coverage --shard=${{ matrix.shard }}/4 --maxWorkers=1
        env:
          COVERAGE_SHARD: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  coverage-merge:
    name: Unit and database coverage (100%)
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .vitest-reports
      # The real config: statements, branches, functions and lines must all be 100%.
      - run: npx vitest --merge-reports --coverage --reporter=default
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env.local
      - run: npm run build
      # Tar preserves hidden .next files and executable modes across artifact jobs.
      - run: tar -czf /tmp/standalone.tgz .next/standalone .next/static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone
          path: /tmp/standalone.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Phone and desktop journeys (PRODUCT.md: every journey at both), each in eight shards of test files, every
  # shard on its own database and app. Playwright's browser is cached by its version, so a shard downloads it
  # only when the version changes.
  e2e:
    name: e2e ${{ matrix.project }} ${{ matrix.shard }}/8
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone
          path: /tmp/build
      - run: tar -xzf /tmp/build/standalone.tgz
      - run: cp .env.example .env.local
      - uses: ./.github/actions/services
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.shard }}-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  ready:
    name: All gates passed
    if: always()
    needs: [static, coverage, coverage-merge, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
