# Independent gates start together. Each database job has its own local services.
# Browser/performance jobs reuse one build; timing-sensitive tests stay serial.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to check; the triggering one when empty.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate:
          - lint
          - format:check
          - typecheck
          - test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run "${{ matrix.gate }}"

  audit:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=high
      - run: npm run audit:shipped

  coverage:
    name: Unit and database coverage (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env.local
      - run: docker compose up -d --wait
      # AVIF encoding and DB writes stay serial within this job.
      - run: npm run test:coverage -- --maxWorkers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env.local
      - run: npm run build
      # Tar preserves hidden .next files and executable modes across artifact jobs.
      - run: tar -czf /tmp/standalone.tgz .next/standalone .next/static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone
          path: /tmp/standalone.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  browsers:
    name: ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test:e2e
          - test:performance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone
          path: /tmp/build
      - run: tar -xzf /tmp/build/standalone.tgz
      - run: cp .env.example .env.local
      - run: docker compose up -d --wait
      - run: npx playwright install --with-deps chromium
      - run: npm run "${{ matrix.suite }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ strategy.job-index }}-browser-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  hydration:
    name: Development hydration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env.local
      - run: docker compose up -d --wait
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hydration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hydration-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  ready:
    name: All gates passed
    if: always()
    needs: [checks, audit, coverage, build, browsers, hydration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
