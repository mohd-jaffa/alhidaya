# The release (docs/RELEASE.md). Creating a version tag (vX.Y.Z) deploys the site to alhidaya.qa; nothing else does.
#
#   git tag -a v1.0.1 -m "v1.0.1" && git push origin v1.0.1        (or publish a GitHub release, which creates the tag)
#
# This is the SHORT check: main's own CI (.github/workflows/ci.yml) is the long, detailed one and does NOT gate a
# release (a release is never held up waiting for it), so a release only runs the small, important checks, side by
# side, in about three minutes:
#   guard   the tag is vX.Y.Z, equals package.json, and sits on main;
#   static  lint, format, types, test layout, dependency audits;
#   tests   every unit test;
#   build   the site, built once with the live address, pruned and checked (no secrets, maps, source or uploads).
# Only when all four pass is the build uploaded over SSH, its database migrated, `current` switched, the app restarted
# and the site checked; a site that does not answer is switched back by itself (scripts/release-deploy.sh).
name: Release
# The run is named after the release tag in the Actions list ("Release v1.0.1"), not after the commit message (D206).
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One release at a time, and never cancelled halfway: a half-finished deploy is what this file exists to avoid.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag, the version and main
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$REF_NAME is not a vX.Y.Z tag."; exit 1; }
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$REF_NAME" ] || { echo "::error::The tag is $REF_NAME but package.json says $version. Change package.json, push, then tag."; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::The tagged commit is not on main. Push it to main first."; exit 1; }
          echo "Release $REF_NAME = $SHA"

  static:
    name: Static and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Each step runs even if an earlier one failed, so one run shows every problem.
      - run: npm run lint
      - run: npm run format:check
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: node scripts/check-test-paths.mjs
        if: ${{ !cancelled() }}
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() }}
      - run: npm run audit:shipped
        if: ${{ !cancelled() }}

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env.local
      - run: npm test -- --reporter=dot

  build:
    name: Build once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The address is written into the build (sitemap, robots.txt, canonical links), so it is the live one.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://alhidaya.qa
      - name: Check and pack the release
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/check-deploy-output.mjs --prune .next/standalone
          mkdir dist
          echo "$(date -u +%Y%m%d-%H%M%S)-${SHA:0:7}" > dist/RELEASE_ID
          echo "$SHA" > dist/COMMIT
          tar -czf dist/release.tar.gz --numeric-owner -C .next/standalone .
          (cd dist && sha256sum release.tar.gz > release.tar.gz.sha256)
          {
            echo "### Release $(cat dist/RELEASE_ID)"
            echo "- commit \`$SHA\`"
            echo "- archive $(du -m dist/release.tar.gz | cut -f1) MB, SHA-256 \`$(cut -d' ' -f1 dist/release.tar.gz.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: dist/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to alhidaya.qa
    needs: [guard, static, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Take this run's build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist
      - name: Check the build is the one to release
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c release.tar.gz.sha256)
          [ "$(cat dist/COMMIT)" = "$SHA" ] || { echo "::error::The build is of $(cat dist/COMMIT), not of $SHA."; exit 1; }
          echo "RELEASE_ID=$(cat dist/RELEASE_ID)" >> "$GITHUB_ENV"
      - name: Deploy
        env:
          RELEASE_SSH_HOST: ${{ secrets.RELEASE_SSH_HOST }}
          RELEASE_SSH_PORT: ${{ secrets.RELEASE_SSH_PORT }}
          RELEASE_SSH_USER: ${{ secrets.RELEASE_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release_key"
          known="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          SSH_KEY_FILE="$key" SSH_KNOWN_HOSTS_FILE="$known" scripts/release-deploy.sh \
            --app alhidaya-site --domain alhidaya.qa --public-url https://alhidaya.qa \
            --archive dist/release.tar.gz --release-id "$RELEASE_ID"
          echo "Release $RELEASE_ID is live on alhidaya.qa." >> "$GITHUB_STEP_SUMMARY"
