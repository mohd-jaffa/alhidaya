# The release (docs/RELEASE.md D2, E6, E7). It changes the client's server only through scripts/release-deploy.sh.
#
#   A release tag (vX.Y.Z, equal to package.json, on a commit that is on main) is the release: CI runs on that exact
#   tag, and only when it passes is the site built ONCE (with the live address), checked and pruned, and deployed to
#   the live app (alhidaya-site, alhidaya.qa). That app exists on the server only from the cutover (docs/RELEASE.md
#   E6), so a tag pushed before it cannot change anything: the deploy stops at its first step.
#
#   The rehearsal is started by hand for any commit or tag, from main, and deploys the same build to the hidden
#   preview host (preview.alhidaya.qa). Nothing else starts this workflow: a push to a branch never deploys.
#
#   git tag -a v1.0.0 -m "v1.0.0" <commit> && git push origin v1.0.0         (the release)
#   gh workflow run release.yml --ref main -f ref=<commit or tag>             (the rehearsal)
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      ref:
        description: The commit or tag to deploy to the rehearsal host (preview.alhidaya.qa)
        type: string
        required: true

permissions:
  contents: read

# One release at a time, and never cancelled halfway: a half-finished deploy is what this file exists to avoid.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Check the request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: A manual run only from main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Start the rehearsal from main (the workflow file there is the reviewed one)."
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and check
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$REF_NAME is not a vX.Y.Z tag."; exit 1; }
            version="$(node -p 'require("./package.json").version')"
            [ "v$version" = "$REF_NAME" ] || { echo "::error::The tag is $REF_NAME but package.json says $version."; exit 1; }
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::The tagged commit is not on main."; exit 1; }
            echo "Release $REF_NAME = $sha goes to PRODUCTION once CI and the build pass."
          else
            echo "target=rehearsal" >> "$GITHUB_OUTPUT"
            echo "Rehearsal of $sha on the preview host."
          fi

  ci:
    name: Re-run CI
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.guard.outputs.sha }}

  build:
    name: Build once
    needs: [guard, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The address is written into the build (sitemap, robots.txt, canonical links), so it is the live one; the
      # rehearsal host overrides only the value read at run time (docs/RELEASE.md section 9, item 7).
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://alhidaya.qa
      - name: Check and pack the release
        env:
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/check-deploy-output.mjs --prune .next/standalone
          mkdir dist
          echo "$(date -u +%Y%m%d-%H%M%S)-${SHA:0:7}" > dist/RELEASE_ID
          echo "$SHA" > dist/COMMIT
          tar -czf dist/release.tar.gz --numeric-owner -C .next/standalone .
          (cd dist && sha256sum release.tar.gz > release.tar.gz.sha256)
          {
            echo "### Release $(cat dist/RELEASE_ID)"
            echo "- commit \`$SHA\`"
            echo "- archive $(du -m dist/release.tar.gz | cut -f1) MB, SHA-256 \`$(cut -d' ' -f1 dist/release.tar.gz.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: dist/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to ${{ needs.guard.outputs.target }}
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ needs.guard.outputs.sha }}
      APP: ${{ needs.guard.outputs.target == 'production' && 'alhidaya-site' || 'alhidaya-rehearsal' }}
      DOMAIN: ${{ needs.guard.outputs.target == 'production' && 'alhidaya.qa' || 'preview.alhidaya.qa' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Take this run's build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist
      - name: Check the build is the one to release
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c release.tar.gz.sha256)
          [ "$(cat dist/COMMIT)" = "$SHA" ] || { echo "::error::The build is of $(cat dist/COMMIT), not of $SHA."; exit 1; }
          echo "RELEASE_ID=$(cat dist/RELEASE_ID)" >> "$GITHUB_ENV"
      - name: Deploy
        env:
          RELEASE_SSH_HOST: ${{ secrets.RELEASE_SSH_HOST }}
          RELEASE_SSH_PORT: ${{ secrets.RELEASE_SSH_PORT }}
          RELEASE_SSH_USER: ${{ secrets.RELEASE_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release_key"
          known="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          SSH_KEY_FILE="$key" SSH_KNOWN_HOSTS_FILE="$known" scripts/release-deploy.sh \
            --app "$APP" --domain "$DOMAIN" --archive dist/release.tar.gz --release-id "$RELEASE_ID"
          echo "Release $RELEASE_ID is live on $DOMAIN." >> "$GITHUB_STEP_SUMMARY"
